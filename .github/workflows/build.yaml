name: build
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a branch supersedes its running checks; every master commit keeps its own.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-modules
      - uses: astral-sh/setup-uv@v6
      - run: npm run prettier-check
      - run: npm run lint
      - run: npm run stylelint
      - run: npm run check-styles
      - run: npm run check-license
      - run: npm run e2e-check
      - run: npm run ruff
      # Skills, AGENTS.md and design docs are what this checks, so it runs on documentation-only changes too
      - run: npm run lint-harness

  test:
    name: Test
    runs-on: ubuntu-latest
    # Ships Chromium and its system libraries. Keep the tag on the playwright version in
    # package-lock.json; on a mismatch the install step below downloads the matching browser.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-modules
      - run: npx playwright install chromium
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-modules
      - run: npm run build
      - run: npm run build-prod
