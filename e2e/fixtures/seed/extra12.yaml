kind: DatasetSnapshot
version: 1
content:
  name: extra-12
  kind: Root
  metadata:
    - kind: AddPushSource
      sourceName: default
      read:
        kind: NdJson
        schema:
          fields:
            - {name: event_time, type: {kind: Timestamp, unit: Millisecond, timezone: UTC}}
            - {name: value, type: {kind: Int64}}
      merge:
        kind: Append
    - kind: SetInfo
      description: Extra dataset 12 for pagination
      keywords: [extra, demo]
