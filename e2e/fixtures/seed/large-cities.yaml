kind: DatasetSnapshot
version: 1
content:
  name: large-cities
  kind: Derivative
  metadata:
    - kind: SetTransform
      inputs:
        - datasetRef: kamu/population
          alias: population
      transform:
        kind: Sql
        engine: datafusion
        query: select event_time, city, population from population where population > 1000
    - kind: SetVocab
      eventTimeColumn: event_time
