worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        font/woff2
        image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 9;
    gzip_vary on;
    keepalive_timeout 65;
    sendfile on;

    server {
        listen       8080;
        server_name  localhost;

        # index.html — never cache, always fetch fresh
        location = /index.html {
            root   /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # JSON files (runtime-config, feature-flags, prerendered-routes, etc.)
        # — never cache, content can change on every deploy
        location ~* \.json$ {
            root   /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # favicon — not hashed, short TTL
        location = /favicon.ico {
            root   /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=86400";
        }

        # Other static static assets have hash in their names — cache forever
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp)$ {
            root   /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA fallback - we serve index.html without caching
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
