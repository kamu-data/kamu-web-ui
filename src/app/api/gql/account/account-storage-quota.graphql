query accountStorageQuota($accountName: AccountName!) {
  accounts {
    byName(name: $accountName) {
      id
      quotas {
        user {
          storage {
            limitTotalBytes
          }
        }
      }
      usage {
        storage {
          totalSizeBytes
          totalDataSizeBytes
          totalCheckpointsSizeBytes
          totalLinkedObjectsSizeBytes
        }
      }
    }
  }
}
