fragment AccountFlowProcessCardData on AccountFlowProcessCard {
  ... on DatasetFlowProcess {
    flowType
    dataset {
      ...DatasetBasics
    }
    summary {
      ...FlowProcessSummaryData
    }
  }

  ... on WebhookFlowSubProcess {
    id
    name
    parentDataset {
      ...DatasetBasics
    }
    summary {
      ...FlowProcessSummaryData
    }
  }
}
