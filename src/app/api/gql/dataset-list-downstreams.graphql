query datasetListDownstreams($datasetId: DatasetID!) {
  datasets {
    byId(datasetId: $datasetId) {
      metadata {
        currentDownstreamDependencies {
          ... on DatasetAccessResultAccessible {
            dataset {
              name
              owner {
                accountName
                avatarUrl
              }
            }
          }
        }
      }
    }
  }
}
