fragment FlowSummaryData on Flow {
  description {
    ...FlowDescriptionData
  }

  flowId
  datasetId
  status

  initiator {
    ...Account
  }

  outcome {
    ...FlowOutcomeData
  }

  timing {
    ...FlowTimingRecordsData
  }

  startCondition {
    ...FlowStartConditionData
  }

  configSnapshot {
    ... on FlowConfigRuleIngest {
      fetchUncacheable
      fetchNextIteration
    }
  }

  taskIds

  retryPolicy {
    maxAttempts
  }
}
