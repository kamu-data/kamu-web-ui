fragment FlowSummaryData on Flow {
  description {
    ... on FlowDescriptionDatasetPollingIngest {
      pollingSource {
        fetch {
          ...FetchStepUrlData
          ...FetchStepFilesGlobData
          ...FetchStepContainerData
        }
      }

      ingestResult {
        ... on FlowDescriptionUpdateResultUpToDate {
          uncacheable
        }

        ... on FlowDescriptionUpdateResultSuccess {
          numBlocks
          numRecords
          updatedWatermark
        }

        ... on FlowDescriptionUpdateResultUnknown {
          message
        }
      }
    }

    ... on FlowDescriptionDatasetPushIngest {
      sourceName
      ingestResult {
        ... on FlowDescriptionUpdateResultUpToDate {
          uncacheable
        }

        ... on FlowDescriptionUpdateResultSuccess {
          numBlocks
          numRecords
          updatedWatermark
        }

        ... on FlowDescriptionUpdateResultUnknown {
          message
        }
      }
    }

    ... on FlowDescriptionDatasetExecuteTransform {
      transform {
        inputs {
          __typename
        }
        transform {
          ... on TransformSql {
            engine
          }
        }
      }

      transformResult {
        ... on FlowDescriptionUpdateResultUpToDate {
          uncacheable
        }

        ... on FlowDescriptionUpdateResultSuccess {
          numBlocks
          numRecords
          updatedWatermark
        }

        ... on FlowDescriptionUpdateResultUnknown {
          message
        }
      }
    }

    ... on FlowDescriptionDatasetHardCompaction {
      compactionResult {
        ... on FlowDescriptionReorganizationSuccess {
          originalBlocksCount
          resultingBlocksCount
          newHead
        }

        ... on FlowDescriptionReorganizationNothingToDo {
          message
          dummy
        }
      }
    }

    ... on FlowDescriptionSystemGC {
      dummy
    }

    ... on FlowDescriptionDatasetReset {
      resetResult {
        newHead
      }
    }

    ... on FlowDescriptionDatasetResetToMetadata {
      resetToMetadataResult {
        ... on FlowDescriptionReorganizationSuccess {
          originalBlocksCount
          resultingBlocksCount
          newHead
        }

        ... on FlowDescriptionReorganizationNothingToDo {
          message
          dummy
        }
      }
    }

    ... on FlowDescriptionWebhookDeliver {
      targetUrl
      label
      eventType
    }
  }

  flowId
  datasetId
  status

  initiator {
    ...Account
  }

  outcome {
    ...FlowOutcomeData
  }

  timing {
    ...FlowTimingRecordsData
  }

  startCondition {
    ...FlowStartConditionData
  }

  configSnapshot {
    ... on FlowConfigRuleIngest {
      fetchUncacheable
      fetchNextIteration
    }
  }

  taskIds

  retryPolicy {
    maxAttempts
  }
}
