fragment FetchStepUrlData on FetchStepUrl {
  url
  eventTime {
    ... on EventTimeSourceFromPath {
      pattern
      timestampFormat
    }
    ... on EventTimeSourceFromMetadata {
      __typename
    }
    ... on EventTimeSourceFromSystemTime {
      __typename
    }
  }
  headers {
    ...RequestHeaderData
  }
  cache {
    __typename
  }
}
