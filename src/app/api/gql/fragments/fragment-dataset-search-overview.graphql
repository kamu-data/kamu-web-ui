fragment DatasetSearchOverview on Dataset {
  ...DatasetBasics
  createdAt
  lastUpdatedAt
  metadata {
    currentInfo {
      ...DatasetCurrentInfo
    }
    currentLicense {
      ...License
    }
    currentDownstreamDependencies {
      ... on DatasetAccessResultNotAccessible {
        ...DatasetAccessResultNotAccessibleData
      }

      ... on DatasetAccessResultAccessible {
        dataset {
          ...DatasetBasics
        }
      }
    }
  }
}
