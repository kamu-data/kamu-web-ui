@if (value) {
    @if (navigationTargetDataset) {
        <a
            [title]="value"
            [class]="'font-monospace ' + class"
            data-test-id="navigableValue"
            [routerLink]="
                {
                    accountName: navigationTargetDataset.accountName,
                    datasetName: navigationTargetDataset.datasetName,
                    blockHash: value,
                } | metadataBlockLink
            "
            >{{ value | slice: -8 }}</a
        >
    } @else {
        <span class="mr-1 font-monospace" [title]="value" data-test-id="notNavigableValue">{{
            value | slice: -8
        }}</span>
    }
    @if (showCopyButton) {
        <button
            (click)="copyToClipboard(value)"
            class="btn btn-sm btn-gray clipboard-btn d-inline-flex align-items-center justify-content-center"
            role="button"
            data-test-id="copyToClipboardButton"
        >
            <mat-icon class="mat-icon" svgIcon="copy" />
        </button>
    }
}
