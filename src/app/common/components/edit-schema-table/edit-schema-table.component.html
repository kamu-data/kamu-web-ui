<div
    style="width: 100%; overflow: auto"
    class="dynamic-table"
    [class.nested-table]="depth > 0"
    [attr.data-test-id]="tablePath"
>
    <table
        mat-table
        [dataSource]="dataSource"
        [trackBy]="trackByFieldIndex"
        #table
        cdkDropList
        [cdkDropListData]="dataSource.data"
        [cdkDropListDisabled]="dragDisabled"
        (cdkDropListDropped)="dropField($event)"
    >
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>name</th>
            <td mat-cell *matCellDef="let element; let rowIndex = index">
                <div *ngIf="editingIndex === rowIndex; else viewName">
                    <input
                        appAutofocus
                        [placeholder]="'Enter name'"
                        *ngIf="editingRow"
                        [(ngModel)]="editingRow.name"
                        type="text"
                        class="form-control"
                        [attr.data-test-id]="tablePath + ':name-input'"
                        (keydown.enter)="saveEditing(rowIndex)"
                        (keydown.escape)="cancelEditing()"
                    />
                </div>
                <ng-template #viewName>
                    <span
                        class="field-name pt-2"
                        [class.text-danger]="leafErrorsForField(element.name).length > 0"
                        [attr.data-test-id]="tablePath + ':field-name:' + element.name"
                    >
                        <mat-icon
                            *ngIf="editingIndex !== rowIndex"
                            class="drag-handle"
                            [class.drag-handle-disabled]="dragDisabled"
                            cdkDragHandle
                            [attr.data-test-id]="tablePath + ':drag-handle:' + (element.name || '#' + rowIndex)"
                            >drag_indicator</mat-icon
                        >
                        {{ element.name }}
                        <mat-icon
                            *ngIf="leafErrorsForField(element.name).length > 0"
                            class="inline-icon text-danger"
                            [matTooltip]="errorTooltip(element.name)"
                            svgIcon="close"
                        />
                        <mat-icon
                            *ngIf="warningsForField(element.name).length > 0"
                            class="inline-icon text-warning"
                            [matTooltip]="warningTooltip(element.name)"
                            >warning</mat-icon
                        >
                    </span>
                </ng-template>
            </td>
        </ng-container>

        <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef>type</th>
            <td mat-cell *matCellDef="let element; let rowIndex = index">
                <div
                    *ngIf="editingIndex === rowIndex; else viewType"
                    class="d-flex justify-content-between py-3 type-editor-row"
                >
                    <div class="type-editor-slot">
                        <app-type-editor
                            *ngIf="editingRow?.type"
                            [value]="editingRow!.type"
                            [typePath]="tablePath + ':type:' + (editingRow!.name || '#' + rowIndex)"
                            (typeChange)="typeChangeHandle($event)"
                        />
                    </div>
                    <div class="action-buttons d-flex ms-2 align-items-center">
                        <button
                            class="d-flex align-items-center justify-content-center edit-button mt-1"
                            (click)="saveEditing(rowIndex)"
                            [disabled]="!editingRow?.name"
                            [attr.data-test-id]="tablePath + ':save-field'"
                        >
                            <mat-icon class="action-button text-muted" svgIcon="check" />
                        </button>
                        <button
                            class="d-flex align-items-center justify-content-center delete-button mt-1"
                            (click)="cancelEditing()"
                            [attr.data-test-id]="tablePath + ':cancel-edit'"
                        >
                            <mat-icon class="action-button text-muted" svgIcon="close"></mat-icon>
                        </button>
                    </div>
                </div>

                <ng-template #viewType>
                    <div class="d-flex align-items-center justify-content-between type-view-row pt-1">
                        <div class="truncate-cell">{{ odfType2String(element) }}</div>
                        <div class="action-buttons d-flex">
                            <button
                                class="d-flex align-items-center justify-content-center edit-button"
                                (click)="editRow(element, rowIndex); $event.stopPropagation()"
                                [attr.data-test-id]="tablePath + ':edit-field:' + (element.name || '#' + rowIndex)"
                            >
                                <mat-icon class="action-button text-muted" svgIcon="pencil" />
                            </button>
                            <button
                                class="d-flex align-items-center justify-content-center delete-button"
                                (click)="deleteRow(rowIndex); $event.stopPropagation()"
                                [attr.data-test-id]="tablePath + ':delete-field:' + (element.name || '#' + rowIndex)"
                            >
                                <mat-icon class="action-button text-muted" svgIcon="delete"></mat-icon>
                            </button>
                        </div>
                    </div>
                    <div
                        *ngFor="let nestedTable of nestedStructTables(element); trackBy: trackByNestedStructPath"
                        class="nested-struct-container"
                    >
                        <app-edit-schema-table
                            [fields]="nestedTable.fields"
                            [depth]="depth + 1"
                            [tablePath]="nestedTable.tablePath"
                            [errors]="nestedErrorsForPath(element.name, nestedTable.path)"
                            (fieldsChange)="onNestedFieldsChange(rowIndex, nestedTable.path, $event)"
                        />
                    </div>
                </ng-template>
            </td>
        </ng-container>

        <tr class="table-header-background" mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns; let rowIndex = index"
            [class.row-editable]="editingIndex === rowIndex"
            [attr.data-test-id]="tablePath + ':row:' + rowIndex"
            cdkDrag
            [cdkDragData]="row"
            [cdkDragDisabled]="dragDisabled"
        ></tr>
    </table>

    <div class="mt-3 add-field-container">
        <button
            class="border-1 bg-light border rounded-2 px-2 btn btn-sm d-flex justify-content-between align-items-center me-3"
            [attr.data-test-id]="tablePath + ':add-field'"
            (click)="startAddField()"
            [disabled]="disabledAddFieldButton"
        >
            <mat-icon class="text-muted fs-4 d-block">add</mat-icon>
            <span class="fs-12 me-2 d-block"> Add field</span>
        </button>
    </div>
</div>
