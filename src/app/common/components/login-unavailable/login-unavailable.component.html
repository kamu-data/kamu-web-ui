<app-error-page-layout>
    <h1 class="mt-4 title" data-test-id="login-unavailable-title">Sign-in is unavailable</h1>
    <p class="mt-3 description" data-test-id="login-unavailable-description">
        This Kamu node is available to signed-in users only, but no sign-in method is enabled on it right now.
        @if (supportEmail) {
            Please
            <a [href]="'mailto:' + supportEmail" data-test-id="login-unavailable-support-link"
                >contact the administrator</a
            >.
        } @else {
            Please contact the administrator of this node.
        }
    </p>
</app-error-page-layout>
