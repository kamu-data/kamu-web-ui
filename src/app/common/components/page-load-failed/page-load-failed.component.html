<app-error-page-layout [title]="TEXTS.TITLE">
    <p class="mt-3" data-test-id="page-load-failed-description">{{ TEXTS.DESCRIPTION }}</p>
    <button
        errorPageActions
        type="button"
        class="app-active-button mx-auto my-4"
        data-test-id="page-load-failed-try-again-button"
        (click)="tryAgain()"
    >
        {{ TEXTS.TRY_AGAIN }}
    </button>
</app-error-page-layout>
