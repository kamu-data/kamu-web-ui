@if (!isAdmin) {
    <span>Logs tab coming soon</span>
}
@if (isAdmin && grafanaTaskDetailsURL) {
    @for (taskId of taskIds; track taskId) {
        <p class="position-relative my-4 box p-4" data-test-id="grafana-logs-section">
            You can
            <a [href]="grafanaTaskLogsUrl(this.grafanaTaskDetailsURL, getTaskChangeHistory(taskId))" target="_blank"
                >see logs in Grafana for task #{{ taskId }}</a
            >
            <mat-icon class="admin-view text-muted"> admin_panel_settings</mat-icon>
        </p>
    }
}
