<div class="query-container">
    <app-search-and-schemas-section [disableSearch]="true" />
    <div class="search-result-container__content mb-50">
        <app-query-and-result-sections
            [sqlLoading]="sqlLoading"
            [sqlError]="sqlErrorMarker$ | async"
            [sqlQueryResponse]="sqlQueryResponse$ | async"
            [(sqlRequestCode)]="sqlRequestCode"
            [monacoPlaceholder]="MONACO_PLACEHOLDER"
            (runSQLRequestEmit)="runSQLRequest($event)"
        >
            <p class="search-result-container__content mt-4">
                The current dataset does not contain any data. Need to
                @if (dataTabData.overviewUpdate) {
                    <a class="add-link" (click)="addData(dataTabData.overviewUpdate)"> add data</a>
                }
            </p>
        </app-query-and-result-sections>
    </div>
</div>
