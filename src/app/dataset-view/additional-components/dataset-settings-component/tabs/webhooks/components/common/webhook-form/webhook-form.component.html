<form [formGroup]="createOrEditSubscriptionForm">
    <div class="d-flex flex-column mt-4">
        <label for="" class="form-label">Target URL <span class="text-danger">*</span></label>
        <input
            type="text"
            data-test-id="target-url"
            formControlName="targetUrl"
            trim="blur"
            class="w-100 form-control"
            #targetUrl
            [readOnly]="disabled"
        />
        <div
            class="text-danger fs-12"
            [input]="targetUrl"
            fieldLabel="Target URL"
            appFieldError
            [group]="createOrEditSubscriptionForm"
            dataTestId="target-url-error"
        ></div>

        <p class="text-muted fs-12">Must be publicly reachable via HTTPS. Localhost and private IPs are not allowed</p>
    </div>
    <div class="d-flex flex-column mt-4">
        <label for="" class="form-label">Subscribed events <span class="text-danger">*</span></label>
        <ng-select
            [items]="dropdownList"
            bindLabel="name"
            bindValue="value"
            formControlName="eventTypes"
            [multiple]="true"
            [readonly]="disabled"
            data-test-id="event-types"
            #eventTypes
        >
            <ng-template ng-option-tmp let-item="item" let-index="index">
                <label class="fs-14 inline-block" [attr.data-test-id]="'event-type-option-' + item.value">
                    {{ item.name }}
                </label>
            </ng-template>
        </ng-select>
        <div
            class="text-danger fs-12"
            [input]="eventTypes"
            fieldLabel="Event selection"
            appFieldError
            [fieldControl]="createOrEditSubscriptionForm.get('eventTypes')"
            [group]="createOrEditSubscriptionForm"
            dataTestId="event-types-error"
        ></div>
    </div>
    <div class="d-flex flex-column mt-4">
        <label for="" class="form-label">Label </label>
        <input
            #label
            type="text"
            [readOnly]="disabled"
            data-test-id="webhook-label"
            formControlName="label"
            trim="blur"
            class="w-100 form-control"
        />
        <div
            class="text-danger fs-12"
            [input]="label"
            fieldLabel="Label"
            appFieldError
            [group]="createOrEditSubscriptionForm"
            dataTestId="label-error"
        ></div>
        <p class="text-muted fs-12">Optional unique label to identify this webhook subscription</p>
    </div>
</form>
