<h2>Webhooks/Manage subscription</h2>
<div class="box p-4">
    <app-webhook-form [createOrEditSubscriptionForm]="createOrEditSubscriptionForm" [dropdownList]="dropdownList" />
    <div class="d-flex flex-wrap justify-content-end my-3">
        <button class="btn btn-light me-4" (click)="onCancel()" type="button" data-test-id="cancel-update-button">
            Cancel
        </button>
        <button
            class="btn btn-success"
            [disabled]="createOrEditSubscriptionForm.invalid || ((busy$ | async) ?? false)"
            (click)="updateWebhook()"
            type="button"
            data-test-id="update-subscription-button"
        >
            Update subscription
        </button>
    </div>

    <router-outlet />
</div>
