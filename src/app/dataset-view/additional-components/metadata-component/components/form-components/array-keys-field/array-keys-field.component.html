<div class="d-flex">
    <app-tooltip-icon [tooltip]="tooltip" />
    <label class="form-label" [attr.data-test-id]="dataTestId + '-label'">{{ label }} </label>
</div>
@for (key of control.controls; track key; let i = $index) {
    <div class="row mt-3">
        <div class="col-md-10">
            <input
                class="form-control"
                [placeholder]="placeholder"
                [formControl]="key"
                [attr.data-test-id]="dataTestId + '-item-' + i"
                trim="blur"
            />
        </div>
        <div class="col-md-2 d-flex justify-content-end align-items-center">
            <button
                class="btn btn-light"
                type="button"
                [attr.data-test-id]="dataTestId + '-remove-' + i"
                (click)="removePrimaryKey(i)"
            >
                x
            </button>
        </div>
    </div>
}
<div class="ms-4">
    <button
        type="button"
        class="add-primary-key-button mt-2"
        (click)="addPrimaryKey()"
        [attr.data-test-id]="dataTestId + '-add'"
    >
        <span>{{ buttonText }}</span>
    </button>
</div>
