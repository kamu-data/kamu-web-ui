<div class="form-check d-flex gap-2">
    <input class="form-check-input" type="checkbox" [formControl]="control" [attr.data-test-id]="dataTestId" />
    <label class="form-check-label" [attr.data-test-id]="dataTestId + '-label'"> {{ label }} </label>
    <app-tooltip-icon [tooltip]="tooltip" />
</div>
