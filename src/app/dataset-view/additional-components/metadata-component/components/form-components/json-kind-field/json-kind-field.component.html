<div class="d-flex">
    <app-tooltip-icon [tooltip]="tooltip" />
    <label class="form-label" [attr.data-test-id]="dataTestId + '-label'">{{ label }} </label>
</div>
@for (descriptor of controlDescriptors; track descriptor) {
    <div class="ms-4">
        <div class="form-check">
            <input
                [id]="dataTestId + '-' + descriptor.value"
                class="form-check-input"
                type="radio"
                [formControl]="control"
                [value]="descriptor.value"
                [attr.data-test-id]="dataTestId + '-' + descriptor.value"
            />
            <label class="form-check-label" [for]="dataTestId + '-' + descriptor.value">
                {{ descriptor.label }}
            </label>
        </div>
    </div>
}
