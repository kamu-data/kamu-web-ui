<div class="d-flex">
    <app-tooltip-icon [tooltip]="tooltip" />
    <label class="form-label" [attr.data-test-id]="dataTestId + '-label'">{{ label }} </label><br />
</div>
@for (item of control.controls; track item; let i = $index) {
    <div class="row mb-2">
        <div class="col-md-5">
            <input
                class="form-control"
                placeholder="Please enter name"
                [formControl]="item.controls.name"
                [attr.data-test-id]="dataTestId + '-name-' + i"
                trim="blur"
            />
            <div
                class="text-danger fs-12"
                [fieldControl]="item.controls.name"
                fieldLabel="Name"
                [dataTestId]="dataTestId + '-name-' + i + '-error'"
                appFieldError
            ></div>
        </div>
        <div class="col-md-6">
            <input
                class="form-control col-md-5"
                placeholder="Please enter value"
                [formControl]="item.controls.value"
                [attr.data-test-id]="dataTestId + '-value-' + i"
                trim="blur"
            />
        </div>
        <div class="col-md-1 d-flex justify-content-end align-items-center">
            <button
                type="button"
                class="btn btn-light"
                (click)="removeItem(i)"
                [attr.data-test-id]="dataTestId + '-remove-' + i"
            >
                x
            </button>
        </div>
    </div>
}
<div
    class="text-danger fs-12"
    [fieldControl]="control"
    [fieldLabel]="label"
    [dataTestId]="dataTestId + '-error'"
    appFieldError
></div>
<div class="ms-4">
    <button type="button" class="add-header-button" [attr.data-test-id]="dataTestId + '-add'" (click)="addItem()">
        <span>{{ buttonText }}</span>
    </button>
</div>
