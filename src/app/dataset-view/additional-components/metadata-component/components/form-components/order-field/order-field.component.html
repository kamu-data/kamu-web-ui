<div class="d-flex">
    <app-tooltip-icon [tooltip]="tooltip" />
    <label class="form-label" [attr.data-test-id]="dataTestId + '-label'">{{ label }} </label>
</div>
@for (option of ORDER_RADIO_CONTROL; track option) {
    <div class="ms-4">
        <div class="form-check">
            <input
                class="form-check-input"
                type="radio"
                [formControl]="control"
                [value]="option.value"
                attr.data-test-id="radio-{{ option.value }}-control"
            />
            <label class="form-check-label" for=""> {{ option.label }} </label>
        </div>
    </div>
}
