<div class="d-flex flex-column dynamic-table" [formGroup]="form">
    <div class="d-flex">
        <app-tooltip-icon [tooltip]="tooltip" />
        <label class="form-label">{{ label }} </label>
    </div>

    <app-edit-schema-table
        class="mb-2"
        [hasTableHeader]="true"
        [columnDescriptors]="[{ columnName: 'name' }, { columnName: 'type' }]"
        [dataRows]="schemaData(form.controls.schema.value)"
        [idTable]="'edit-schema-table'"
        tableClass="font-monospace"
    />
</div>
