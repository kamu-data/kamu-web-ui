<div class="d-flex">
    <app-tooltip-icon [tooltip]="tooltip" />
    <label class="form-label" [attr.data-test-id]="dataTestId + '-label'">{{ label }} </label><br />
</div>
<div class="ms-4">
    <div class="form-check d-flex gap-2">
        <input
            class="form-check-input"
            type="radio"
            [formControl]="control.controls.kind"
            [value]="EventTimeSourceKind.FROM_METADATA"
            data-test-id="event-time-from-metadata"
        />
        <label class="form-check-label" for=""> From metadata </label>
        <app-tooltip-icon [tooltip]="innerTooltips.fromMetadata" />
    </div>
    <div class="form-check d-flex gap-2">
        <input
            class="form-check-input"
            type="radio"
            [formControl]="control.controls.kind"
            [value]="EventTimeSourceKind.FROM_SYSTEM_TIME"
            data-test-id="event-time-from-system-time"
        />
        <label class="form-check-label" for=""> From system time </label>
        <app-tooltip-icon [tooltip]="innerTooltips.fromSystemTime" />
    </div>
    <div class="form-check mt-1 d-flex gap-2">
        <input
            class="form-check-input"
            type="radio"
            [formControl]="control.controls.kind"
            [value]="EventTimeSourceKind.FROM_PATH"
            data-test-id="event-time-from-path"
        />
        <label class="form-check-label" for=""> From path </label>
        <app-tooltip-icon [tooltip]="innerTooltips.fromPath" />
    </div>
    @if (control.controls.kind.value === EventTimeSourceKind.FROM_PATH) {
        <div class="mt-3">
            <app-input-field
                [control]="control.controls.pattern"
                label="Pattern"
                [requiredField]="true"
                placeholder="Enter pattern..."
                [tooltip]="PATTERN_TOOLTIP"
                dataTestId="event-time-pattern"
            />
        </div>
        <div class="mt-3">
            <app-typeahead-field
                [control]="control.controls.timestampFormat"
                label="Timestamp format"
                placeholder="--Select timestamp format--"
                [data]="FORMATS"
                [tooltip]="TIMESTAMP_TOOLTIP"
                dataTestId="event-time-timestamp-format"
            />
        </div>
    }
</div>
