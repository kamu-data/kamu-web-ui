<div class="d-flex">
    <app-tooltip-icon [tooltip]="tooltip" />
    <label class="form-label" [attr.data-test-id]="dataTestId + '-label'"
        >{{ label }}
        @if (requiredField) {
            <span class="text-danger" [attr.data-test-id]="dataTestId + '-required'">*</span>
        }</label
    ><br />
</div>
@for (item of control.controls; track item; let i = $index) {
    <div class="row mb-2">
        <div class="col-md-5">
            <input
                class="form-control"
                placeholder="Please enter path"
                [formControl]="item.controls.path"
                [attr.data-test-id]="dataTestId + '-path-' + i"
                trim="blur"
            />
        </div>
        <div class="col-md-6">
            <select
                [formControl]="item.controls.qos"
                class="form-select"
                [attr.data-test-id]="dataTestId + '-qos-' + i"
            >
                <option value=""></option>
                <option value="AtLeastOnce">At Least Once</option>
                <option value="AtMostOnce">At Most Once</option>
                <option value="ExactlyOnce">Exactly Once</option>
            </select>
        </div>
        <div class="col-md-1 d-flex justify-content-end align-items-center">
            <button
                type="button"
                class="btn btn-light"
                (click)="removeItem(i)"
                [attr.data-test-id]="dataTestId + '-remove-' + i"
            >
                x
            </button>
        </div>
    </div>
}
<div class="ms-4">
    <button type="button" class="add-header-button" [attr.data-test-id]="dataTestId + '-add'" (click)="addItem()">
        <span>{{ buttonText }}</span>
    </button>
</div>
