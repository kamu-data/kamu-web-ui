<div class="d-flex">
    <app-tooltip-icon [tooltip]="tooltip" />
    <label class="form-label" [attr.data-test-id]="dataTestId + '-label'"
        >{{ label }}
        @if (requiredField) {
            <span class="text-danger" [attr.data-test-id]="dataTestId + '-required'">*</span>
        }
    </label>
</div>
<input
    class="form-control"
    [placeholder]="placeholder"
    [formControl]="control"
    [attr.data-test-id]="dataTestId"
    [ngbTypeahead]="search"
    (focus)="focus$.next(input.value)"
    (click)="click$.next(input.value)"
    #instance="ngbTypeahead"
    #input
/>
<div
    class="text-danger fs-12"
    [input]="input"
    [fieldControl]="control"
    [fieldLabel]="label"
    [dataTestId]="dataTestId + '-error'"
    appFieldError
></div>
