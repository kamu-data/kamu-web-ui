<div [formGroup]="form">
    <div class="d-flex">
        <app-tooltip-icon [tooltip]="tooltip" />
        <label class="form-label"
            >{{ label }}
            @if (requiredField) {
                <span class="text-danger">*</span>
            }
        </label>
    </div>
    <input
        class="form-control"
        [placeholder]="placeholder"
        [formControlName]="controlName"
        [attr.data-test-id]="dataTestId"
        [ngbTypeahead]="search"
        (focus)="focus$.next(control.value)"
        (click)="click$.next(control.value)"
        #instance="ngbTypeahead"
        #control
    />
    <div
        class="text-danger fs-12"
        [input]="control"
        [fieldControl]="form.get(controlName)"
        [fieldLabel]="label"
        [appFieldError]="['maxlength']"
        [group]="form"
    ></div>
</div>
