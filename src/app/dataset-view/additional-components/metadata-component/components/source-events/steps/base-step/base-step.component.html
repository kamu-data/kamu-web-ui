@if (section) {
    <div [formGroup]="section.form">
        <h2 class="text-center">
            {{ sectionName | titlecase }}
        </h2>
        <p class="text-center mb-4">{{ description }}</p>
        <app-select-kind-field [form]="section.form" [data]="sectionStepRadioData" />
        <div class="row">
            <app-source-fields [fields]="section.fields" [sectionName]="sectionName" />
            <ng-content />
        </div>
    </div>
}
