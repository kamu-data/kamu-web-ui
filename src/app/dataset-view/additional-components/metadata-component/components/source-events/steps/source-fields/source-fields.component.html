<!-- A kind switch builds new controls, so tracking the control rebuilds the fields of the new kind -->
@for (field of fields; track field.control) {
    @if (field.shown()) {
        <div class="col-md-8 offset-md-2 mt-4">
            @if (isScalarSourceField(field)) {
                <app-scalar-source-field
                    [field]="field"
                    [dataTestId]="field.dataTestId ?? sectionName + '-' + field.name"
                />
            } @else {
                <app-composite-source-field
                    [field]="field"
                    [dataTestId]="field.dataTestId ?? sectionName + '-' + field.name"
                />
            }
        </div>
    }
}
