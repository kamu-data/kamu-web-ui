@if (isLoadedPdfFile) {
    <div class="d-flex justify-content-end pdf-viewer-header">
        <button type="button" (click)="prevPage()" style="border: none" [disabled]="page <= 1">&#9664;</button>
        <span>Page {{ page }} / {{ totalPages }}</span>
        <button type="button" (click)="nextPage()" style="border: none" [disabled]="page >= totalPages">&#9654;</button>
        <div style="margin-left: 20px; display: flex; gap: 5px; align-items: center">
            <button type="button" (click)="zoomOut()" class="zoom-button">&#8211;</button>
            <span> {{ zoom | percent }}</span>
            <button type="button" (click)="zoomIn()" class="zoom-button">+</button>
        </div>
    </div>
}
@if (safePdfUrl) {
    <div class="mt-4">
        <pdf-viewer
            [src]="safePdfUrl"
            [render-text]="true"
            [original-size]="false"
            [autoresize]="true"
            [show-borders]="true"
            external-link-target="top"
            [(page)]="page"
            [zoom]="zoom"
            zoom-scale="page-width"
            (after-load-complete)="afterLoadComplete($event)"
            style="width: 100%; height: 800px"
        />
    </div>
} @else {
    <p class="mt-4">The PDF document cannot be displayed.</p>
}
