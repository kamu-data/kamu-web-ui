<div *ngIf="loadingFileDetails$ | async">
    <mat-progress-bar data-test-id="editor-progress-bar" class="w-100 mt-4" mode="indeterminate" />
    <div class="mt-4 text-center">Loading file...</div>
</div>

<div *ngIf="fileInfo$ | async as fileDetails">
    <ngb-alert *ngIf="!isLatestVersion(fileDetails)" [dismissible]="false" class="my-4">
        A newer version of this file is available v({{ fileDetails.countVersions }}).
        <a class="text-dark fw-500 text-decoration-underline" (click)="goToLatestVersionedFile()"
            >Go to latest version</a
        >
    </ngb-alert>

    <div>
        <div class="d-flex flex-column">
            <div class="d-flex justify-content-between align-items-center">
                <div class="fs-5 fw-500">Preview</div>
            </div>
            <div class="d-flex justify-content-between mt-4">
                <div class="d-flex">
                    <input
                        type="file"
                        class="file-input d-none"
                        onclick="this.value = null"
                        (change)="onFileSelected($event)"
                        data-test-id="input-file"
                        #fileUpload
                    />
                    <div class="d-flex align-items-center" *ngIf="fileDetails.fileInfo?.contentType">
                        <button
                            (click)="fileUpload.click()"
                            class="border-1 bg-light border d-flex rounded-2 btn btn-sm justify-content-between align-items-center"
                            data-test-id="upload-file-button"
                        >
                            <mat-icon class="mat-icon-svg-size me-2 text-muted mb-2"> upload</mat-icon>
                            <span class="fs-12 me-2 d-block">Upload file</span>
                        </button>
                    </div>

                    <button
                        class="ms-3 border-1 bg-light border d-flex rounded-2 btn btn-sm align-items-center"
                        data-test-id="rollback-file-button"
                        (click)="onRollbackFile(fileDetails.fileInfo?.version!)"
                        *ngIf="fileDetails.fileInfo?.version! > 1"
                    >
                        <mat-icon class="mat-icon-svg-size me-2 text-muted mb-2"> undo</mat-icon>
                        <span class="fs-12 me-2 d-block rollback-label">Rollback</span>
                    </button>
                </div>
                <div>
                    <button
                        *ngIf="fileDetails.fileInfo?.version"
                        class="border-1 bg-light border d-flex rounded-2 btn btn-sm justify-content-between align-items-center"
                        (click)="downloadFile(fileDetails)"
                    >
                        <mat-icon class="mat-icon-svg-size me-2 text-muted mb-2"> download</mat-icon>

                        <span class="fs-12 me-2 d-block">Download file</span>
                    </button>
                </div>
            </div>
        </div>

        <div [ngSwitch]="fileDetails.fileInfo?.contentType! | previewFileType" class="mb-4 mt-2">
            <div *ngSwitchCase="'pdf'">
                @defer (when (pdfComponent)) {
                    <ng-container *ngComponentOutlet="pdfComponent; inputs: { safePdfUrl: urlContentPath }" />
                }
            </div>

            <div *ngSwitchCase="'image'" class="text-center box p-4 mt-3 bg-light">
                <img [src]="urlContentPath" class="preview-img" />
            </div>

            <div *ngSwitchCase="'svg'" class="text-center box p-4 mt-3 bg-light">
                <mat-icon *ngIf="svgIconName" [svgIcon]="svgIconName" class="preview-svg"></mat-icon>
            </div>

            <div *ngSwitchCase="'json'" class="box p-2 bg-light mt-3">
                <pre *ngIf="contentText$ | async as contentJson"> {{ contentJson | json }}</pre>
            </div>

            <div class="mt-4" *ngSwitchCase="'text'" class="box p-2 bg-light mt-3">
                <p>{{ contentText$ | async }}</p>
            </div>

            <div class="mt-4" *ngSwitchCase="'video'" class="box p-2 bg-light mt-3">
                <video controls preload="auto" width="100%" height="500px" [src]="urlContentPath" playsinline>
                    Your browser does not support embedded videos
                </video>
            </div>

            <div *ngSwitchCase="'audio'" class="box p-4 bg-light mt-3">
                <audio [src]="urlContentPath" controls preload="auto" controlsList="nodownload">
                    Your browser does not support the audio element.
                </audio>
            </div>

            <div class="mt-3 text-center" *ngSwitchDefault>
                <div *ngIf="fileDetails.fileInfo">
                    <p class="fs-5 box p-4 bg-light">File preview is not supported</p>
                </div>

                <div
                    class="upload-file-container my-4 bg-light"
                    appDragAndDrop
                    (click)="fileUpload.click()"
                    (fileDropped)="onFileDropped($event)"
                    *ngIf="!fileDetails.fileInfo?.contentType"
                >
                    <div class="mt-4 mb-2">
                        <span class="upload-file-description">File is empty</span>
                    </div>
                    <div class="upload-file-icon">
                        <mat-icon class="text-muted">cloud_upload</mat-icon>
                    </div>
                    <p class="upload-file-description text-muted">Drag and drop file</p>

                    <div class="upload-button-container mb-4">
                        <button
                            class="border-1 upload-button bg-light border rounded-2 px-2 btn btn-sm d-flex justify-content-between align-items-center"
                        >
                            <mat-icon class="mat-icon-svg-size text-muted mb-1"> upload</mat-icon>
                            <span class="fs-12 ms-2 d-block w-100"> Upload file</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
